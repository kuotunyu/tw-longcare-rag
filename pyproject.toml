[project]
name = "twlongcare"
version = "0.1.0"
description = "台灣長照法規 RAG 諮詢系統：每句回答附法條引用、查無法源誠實拒答"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "bm25s>=0.3.9",
    "chromadb>=1.5.9",
    "huggingface-hub>=1.24.0",
    "jieba>=0.42.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.2.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twlongcare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
