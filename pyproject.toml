[project]
name = "twlongcare"
version = "0.1.0"
description = "台灣長照法規 RAG 諮詢系統：每句回答附法條引用、查無法源誠實拒答"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "huggingface-hub>=1.24.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twlongcare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
